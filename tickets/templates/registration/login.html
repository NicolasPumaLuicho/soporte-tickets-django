{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión — Soporte</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .caja {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
            padding: 32px 36px;
            width: 360px;
        }
        h1 { color: #004d7a; font-size: 22px; margin-top: 0; }
        input {
            width: 100%;
            padding: 9px 10px;
            margin: 4px 0 14px;
            border: 1px solid #c7d2db;
            border-radius: 6px;
            box-sizing: border-box;
        }
        label { font-size: 14px; font-weight: 600; }
        button {
            background: #004d7a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #00629b; }
        .error { color: #b00020; font-size: 13px; }
    </style>
</head>
<body>
<div class="caja">
    <h1>Iniciar sesión</h1>
    {% if form.errors %}
        <p class="error">Usuario o contraseña incorrectos.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
