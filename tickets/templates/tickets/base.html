{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Tickets de Soporte{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #1f2933;
        }
        header {
            background: #004d7a;
            color: #fff;
            padding: 16px 32px;
        }
        header h1 { margin: 0; font-size: 22px; }
        header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
        .menu-categorias {
            background: #fff;
            border-bottom: 1px solid #d6dee5;
            padding: 12px 32px;
        }
        .menu-categorias ul { list-style: none; margin: 0; padding-left: 20px; }
        .menu-categorias > ul {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 28px;
            padding-left: 0;
        }
        .menu-categorias li { font-size: 14px; line-height: 1.5; }
        .menu-categorias > ul > li { font-weight: 600; color: #004d7a; }
        .menu-categorias ul ul li { font-weight: 400; color: #1f2933; }
        main { max-width: 820px; margin: 32px auto; padding: 0 16px; }
        .tarjeta {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
            padding: 24px 28px;
        }
        .chip {
            display: inline-block;
            background: #e3f2fd;
            color: #005a9e;
            border-radius: 999px;
            padding: 2px 12px;
            font-size: 13px;
            margin-left: 8px;
        }
        .comentario {
            border: 1px solid #d6dee5;
            border-left: 4px solid #004d7a;
            border-radius: 8px;
            padding: 16px 18px;
            margin: 18px 0;
            background: #fbfdff;
        }
        .comentario .autor { font-weight: 600; }
        .comentario .fecha { color: #62717e; font-size: 13px; }
        .navegacion { display: flex; gap: 12px; align-items: center; margin-top: 18px; }
        .boton {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
        .boton-primario { background: #004d7a; color: #fff; }
        .boton-primario:hover { background: #00629b; }
        .boton-deshabilitado { background: #ccd5dc; color: #7b8a95; cursor: not-allowed; }
        .contador { color: #62717e; font-size: 14px; margin-left: auto; }
        .volver { display: inline-block; margin-top: 20px; color: #004d7a; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e3e9ee; }
        th { font-size: 13px; text-transform: uppercase; color: #62717e; }
        td a { color: #004d7a; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Gestión de Tickets de Soporte</h1>
        <p>Prioridad con árbol de expresión y sesiones — Semana 10</p>
    </header>
    {% include "tickets/_menu_categorias.html" %}
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
